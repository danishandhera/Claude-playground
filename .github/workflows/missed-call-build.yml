name: Missed Call — build APK

# Builds the Missed Call debug APK in the cloud and uploads it as a downloadable
# artifact, so it can be sideloaded onto a phone with no local Android toolchain.
# Scoped to the missed-call/ subproject of this monorepo.

on:
  push:
    paths:
      - 'missed-call/**'
      - '.github/workflows/missed-call-build.yml'
  workflow_dispatch: {}   # allows manual "Run workflow" from the Actions tab

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: missed-call

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu-latest runner ships a preinstalled Android SDK (ANDROID_HOME set).
      # Accept licenses defensively so any auto-provisioned build-tools don't stall.
      - name: Accept Android SDK licenses
        working-directory: ${{ github.workspace }}
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      # Provide Gradle 8.9 on PATH. The repo's wrapper jar is intentionally not
      # committed (binary); using system Gradle avoids needing it.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: missed-call-debug-apk
          path: missed-call/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
