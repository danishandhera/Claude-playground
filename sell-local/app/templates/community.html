{% extends "base.html" %}
{% block title %}{{ community.name }} — Sell Local{% endblock %}
{% block content %}
<section id="community-browse">
  <a href="/" class="inline-flex items-center gap-1 text-sm font-medium text-slate-500 hover:text-brand-600">
    <span aria-hidden="true">&larr;</span> All communities
  </a>

  <h1 class="mt-3 text-2xl font-bold tracking-tight text-ink sm:text-3xl">{{ community.name }}</h1>

  <!-- Search-as-you-type: htmx GETs the results fragment, swaps #results. -->
  <form id="search-form"
        role="search"
        class="mt-4"
        hx-get="/c/{{ community.slug }}/search"
        hx-target="#results"
        hx-swap="innerHTML"
        hx-trigger="input changed delay:300ms from:#search-input, submit"
        onsubmit="return false;">
    <label for="search-input" class="sr-only">Search listings</label>
    <div class="relative">
      <span aria-hidden="true" class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="h-5 w-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.3-4.3m1.8-4.7a6.5 6.5 0 11-13 0 6.5 6.5 0 0113 0z" />
        </svg>
      </span>
      <input id="search-input"
             type="search"
             name="q"
             value="{{ q }}"
             placeholder="Search listings…"
             autocomplete="off"
             class="w-full rounded-xl border border-slate-200 bg-white py-3 pl-10 pr-4 text-ink shadow-sm placeholder:text-slate-400 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/40">
    </div>
  </form>

  <div id="results" class="mt-5">
    {% include "_listings.html" %}
  </div>
</section>
{% endblock %}
