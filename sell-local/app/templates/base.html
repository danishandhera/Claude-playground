<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sell Local{% endblock %}</title>
  <meta name="description" content="Browse and search for-sale listings from your Dubai community.">
  <!-- htmx: search-as-you-type + partial swaps. Tailwind via CDN (no build step). -->
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // One calm brand accent (teal) + neutral surfaces. Central so every page is coherent.
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50:  '#eefbf9',
              100: '#d5f5f0',
              500: '#0d9488',
              600: '#0b7d73',
              700: '#0a655d',
            },
            ink: '#1f2933',
          },
          fontFamily: {
            sans: ['ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
          },
        },
      },
    };
  </script>
</head>
<body class="h-full min-h-full flex flex-col bg-slate-50 text-ink antialiased font-sans">
  <header class="sticky top-0 z-10 border-b border-slate-200 bg-white/90 backdrop-blur">
    <div class="mx-auto flex max-w-3xl items-center gap-2 px-4 py-3">
      <a href="/" class="flex items-center gap-2 text-lg font-semibold tracking-tight text-ink">
        <span class="grid h-7 w-7 place-items-center rounded-lg bg-brand-500 text-sm font-bold text-white">SL</span>
        Sell&nbsp;Local
      </a>
    </div>
  </header>

  <main class="mx-auto w-full max-w-3xl flex-1 px-4 py-6 sm:py-8">
    {% block content %}{% endblock %}
  </main>

  <footer class="border-t border-slate-200 bg-white">
    <div class="mx-auto max-w-3xl px-4 py-5 text-sm text-slate-500">
      Sell Local — community classifieds. Listings are member-submitted; verify before you buy.
    </div>
  </footer>
</body>
</html>
